services:
  mysql:
    image: mysql:8.0
    container_name: spendwise_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chronos
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spendwise_backend
    restart: unless-stopped
    command: >
      sh -c "
      npm install &&
      npx prisma generate &&
      npx prisma db push --accept-data-loss &&
      rm -rf dist &&
      npm run start:dev
      "
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spendwise_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Docker-ben a backend service neve "backend" – a Vite proxy ezen keresztül éri el
      - BACKEND_URL=http://backend:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mysql_data:
